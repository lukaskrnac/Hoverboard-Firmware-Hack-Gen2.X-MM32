name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install pyocd libusb-package pyinstaller
      - name: Build MM32Flasher.exe
        run: >
          pyinstaller --onefile --noconsole --name MM32Flasher --paths tools
          --collect-all pyocd --collect-all cmsis_pack_manager --collect-all libusb_package
          --copy-metadata pyocd tools/mm32flash_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: MM32Flasher
          path: dist/MM32Flasher.exe
