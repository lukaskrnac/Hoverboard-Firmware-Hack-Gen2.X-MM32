name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/windows-exe.yml"
      - "tools/mm32_uart_test.py"
      - "tools/cansimple_uart.py"
      - "tools/endpoints.json"

permissions:
  contents: read

jobs:
  exe:
    if: github.event.head_commit.message != 'Attach verified Windows executables to v1.1'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: python -m pip install pyocd libusb-package pyinstaller pyserial==3.5
      - name: Build MM32Flasher.exe
        run: >
          pyinstaller --onefile --noconsole --name MM32Flasher --paths tools
          --collect-all pyocd --collect-all cmsis_pack_manager --collect-all libusb_package
          --copy-metadata pyocd tools/mm32flash_gui.py
      - name: Build MM32_UART_Tester.exe
        run: >
          python -m PyInstaller --onefile --noconsole --name MM32_UART_Tester --paths tools
          --add-data "tools/endpoints.json:." tools/mm32_uart_test.py
      - name: Smoke-test the packaged UART tester
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\MM32_UART_Tester.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum MM32Flasher.exe > MM32Flasher.exe.sha256
          sha256sum MM32_UART_Tester.exe > MM32_UART_Tester.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MM32Flasher
          if-no-files-found: error
          path: |
            dist/MM32Flasher.exe
            dist/MM32Flasher.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MM32_UART_Tester
          if-no-files-found: error
          path: |
            dist/MM32_UART_Tester.exe
            dist/MM32_UART_Tester.exe.sha256

  release:
    # only for a pushed v* tag: attach both executables to the GitHub release of that tag
    if: >-
      always() && ((startsWith(github.ref, 'refs/tags/v') && needs.exe.result == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       github.event.head_commit.message == 'Attach verified Windows executables to v1.1'))
    needs: exe
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.ref == 'refs/heads/main' && '43262533808' || github.run_id }}
          name: MM32Flasher
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.ref == 'refs/heads/main' && '43262533808' || github.run_id }}
          name: MM32_UART_Tester
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c MM32Flasher.exe.sha256 MM32_UART_Tester.exe.sha256
          assets=(MM32Flasher.exe MM32Flasher.exe.sha256 MM32_UART_Tester.exe MM32_UART_Tester.exe.sha256)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$REPO" --verify-tag --title "MM32 Windows tools $TAG" \
              --notes "Windows SWD flasher and CANSimple UART tester for the MM32 hoverboard firmware. Both executables run without Python. SHA-256 files are included."
          fi
