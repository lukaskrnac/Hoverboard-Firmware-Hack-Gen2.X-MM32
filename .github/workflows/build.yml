name: Build and compare upstream
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  UPSTREAM_URL: https://gitlab.com/ailife8881/Hoverboard-Firmware-Hack-Gen2.x-MM32.git
  UPSTREAM_COMMIT: 8b21b8f0c26ed9e218b7004c4efcdede6c7f6d1c
jobs:
  import:
    if: github.repository == 'lukaskrnac/Hoverboard-Firmware-Hack-Gen2.X-MM32'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.import.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import original history once
        id: import
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Makefile ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add upstream "$UPSTREAM_URL"
            git fetch upstream main
            git cat-file -e "$UPSTREAM_COMMIT^{commit}"
            git merge --allow-unrelated-histories --no-edit "$UPSTREAM_COMMIT"
            python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          original = p.read_bytes()
          banner = """# Unofficial GitHub fork — MM32 hoverboard firmware

          **Original project and ongoing development: [AILIFE's GitLab repository](https://gitlab.com/ailife8881/Hoverboard-Firmware-Hack-Gen2.x-MM32).**

          This independent GitHub fork is maintained by [Lukáš Krnáč](https://github.com/lukaskrnac) for GitHub Actions builds and experiments. It is not the official repository and is not endorsed by the original authors. All original authorship, Git history, copyright notices and licenses are preserved. Credit belongs to the upstream authors and contributors.

          Imported upstream commit: [8b21b8f](https://gitlab.com/ailife8881/Hoverboard-Firmware-Hack-Gen2.x-MM32/-/commit/8b21b8f0c26ed9e218b7004c4efcdede6c7f6d1c).

          ## GitHub Actions builds

          Open **Actions → Build and compare upstream**. Each run builds SPIN05 main firmware and PinFinder using Arm GNU Toolchain 14.2.Rel1 (GCC 14.2.1), independently builds the pinned upstream commit, and compares the binary files byte for byte. Download the **SPIN05-firmware-and-comparison** artifact for binaries, ELF/HEX files, build logs and SHA-256 results.

          The comparison is against a fresh build of upstream source, not a claim of equality with an author's separately published binary. Firmware source and build settings are initially unchanged. Future intentional firmware changes will require reviewing/updating the comparison baseline. No flashing is performed by CI.

          To build locally with the same toolchain: `make MCU=SPIN05 both`.
          The upstream instructions follow unchanged below.

          ---

          """
          p.write_bytes(banner.encode() + original)
          PY
            git add README.md
            git commit -m "docs: identify unofficial fork and credit original authors"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: import
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.revision }}
          persist-credentials: false
          path: fork
      - name: Install pinned Arm GNU toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$archive" -o "$RUNNER_TEMP/$archive"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/toolchain" --strip-components=1
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
      - name: Build fork and independent upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-gcc --version | tee artifacts/compiler.txt
          test "$(arm-none-eabi-gcc -dumpversion)" = 14.2.1
          git clone --no-checkout "$UPSTREAM_URL" upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          printf 'Fork: %s\nUpstream: %s\n' "$(git -C fork rev-parse HEAD)" "$(git -C upstream rev-parse HEAD)" > artifacts/revisions.txt
          make -C fork MCU=SPIN05 both 2>&1 | tee artifacts/fork-build.log
          make -C upstream MCU=SPIN05 both 2>&1 | tee artifacts/upstream-build.log
          cp -r fork/HoverBoardMindMotion/build/spin05 artifacts/fork
          cp -r upstream/HoverBoardMindMotion/build/spin05 artifacts/upstream
      - name: Compare firmware bytes
        shell: bash
        run: |
          set -euo pipefail
          for image in hoverboard pinfinder; do
            cmp "artifacts/fork/$image.bin" "artifacts/upstream/$image.bin"
            echo "$image.bin: IDENTICAL ($(stat -c%s "artifacts/fork/$image.bin") bytes)" | tee -a artifacts/comparison.txt
          done
          sha256sum artifacts/{fork,upstream}/*.bin | tee artifacts/SHA256SUMS.txt
          cat artifacts/revisions.txt artifacts/comparison.txt artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SPIN05-firmware-and-comparison
          path: artifacts/
          retention-days: 90
