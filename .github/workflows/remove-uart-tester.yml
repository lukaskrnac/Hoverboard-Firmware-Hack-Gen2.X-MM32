name: Remove retired UART tester downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-uart-tester.yml

permissions: {}

jobs:
  release-assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete only the UART tester files from v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$REPO/releases/tags/v1.1" --jq '.assets[] | select(.name == "MM32_UART_Tester.exe" or .name == "MM32_UART_Tester.exe.sha256") | .id')
          for id in $assets; do
            gh api --method DELETE "repos/$REPO/releases/assets/$id"
          done
          gh release edit v1.1 --repo "$REPO" --notes "Windows SWD flasher for the MM32 hoverboard firmware. No Python needed. A SHA-256 file is included. For USB-UART motor control and telemetry, use the [upstream web console](https://gitlab.com/ailife8881/remoteuartbus-online)."
  build-artifacts:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete only artifacts named MM32_UART_Tester
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=$(gh api --paginate "repos/$REPO/actions/artifacts?name=MM32_UART_Tester&per_page=100" --jq '.artifacts[] | select(.name == "MM32_UART_Tester") | .id')
          for id in $artifacts; do
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
          done
